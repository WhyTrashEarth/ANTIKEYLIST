<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIKEYLIST Input Validation</title>
    <script>
        // Approved characters for input validation
        const approvedChars = "3479ACDEFGHJKMNPQRTUVWXYacdefghjkmnpqrtuvwy@#$%^&*_+=";

        // Check the entire value, including pasted characters, without changing it.
        function validateInput(event) {
            const input = event.target.value;
            const errorMsg = document.getElementById("errorMsg");
            const excluded = Array.from(input).filter(char => !approvedChars.includes(char));
            errorMsg.textContent = !input ? "Enter a sample to check." : excluded.length
                ? `${excluded.length} character(s) outside the original set. Your input is unchanged.`
                : "Every character is in the original set.";
        }
    </script>
</head>
<body>

    <h1>ANTIKEYLIST Input Validation</h1>

    <!-- Input field for testing validation -->
    <label for="inputField">Enter Text:</label>
    <input type="text" id="inputField" oninput="validateInput(event)" placeholder="Enter a sample" autocomplete="off" spellcheck="false" aria-describedby="errorMsg">
    <p id="errorMsg" role="status">Enter a sample to check.</p>

</body>
</html>
